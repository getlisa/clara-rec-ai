name: ClaraAssistant

options:
  bundleIdPrefix: ai.justclara
  # The SDK binary is built for arm64-apple-ios17.2.
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0

targets:
  ClaraAssistant:
    type: application
    platform: iOS
    sources:
      - path: ClaraAssistant
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      # MWDATMockDevice is deliberately not linked: it is unused, and it pulls in Speech,
      # CoreMotion and CoreLocation, each of which then demands its own Info.plist purpose
      # string or App Store validation rejects the build (ITMS-90683).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.justclara.ClaraAssistant
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: ClaraAssistant/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TS3BFX5G72
        ENABLE_USER_SCRIPT_SANDBOXING: YES
